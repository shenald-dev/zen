[project]
name = "zen-timer"
version = "0.2.1"
description = "🧘 Deep-work timer. Simple terminal app for focus sessions. No GUI, just flow."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shenal Diluksha", email = "shenald@users.noreply.github.com" }
]
maintainers = [
    { name = "shenald-dev", email = "shenald@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["zen", "timer", "pomodoro", "focus", "deep-work", "cli", "tui", "productivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.9.0,<16.0.0",
    "typer>=0.12.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "flake8>=7.0.0,<8.0.0",
    "pylint>=3.0.0,<5.0.0"
]

[project.scripts]
zen = "zen.timer:main"

[project.urls]
Homepage = "https://github.com/shenald-dev/zen"
Documentation = "https://github.com/shenald-dev/zen#readme"
Repository = "https://github.com/shenald-dev/zen"
Issues = "https://github.com/shenald-dev/zen/issues"
Changelog = "https://github.com/shenald-dev/zen/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = [
    "src/zen/__main__.py",
    "src/zen/__init__.py"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
